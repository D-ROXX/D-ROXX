<svg width="100%" viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes fillCell {
        0% { opacity: 0; }
        100% { opacity: 1; }
      }
      @keyframes glow {
        0%, 100% { filter: drop-shadow(0 0 0px rgba(0,255,0,0)); }
        50% { filter: drop-shadow(0 0 4px rgba(0,255,0,0.3)); }
      }
      .contrib-cell {
        animation: fillCell 0.5s ease-out forwards;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      .contrib-cell:hover { 
        filter: brightness(1.3);
        r: 3;
      }
      .month-label { 
        font-family: Arial, sans-serif;
        font-size: 12px;
        font-weight: bold;
        fill: #24292e;
      }
      .day-label {
        font-family: Arial, sans-serif;
        font-size: 10px;
        fill: #6a737d;
      }
      .title {
        font-family: Arial, sans-serif;
        font-size: 18px;
        font-weight: 700;
        fill: #24292e;
      }
      .subtitle {
        font-family: Arial, sans-serif;
        font-size: 12px;
        fill: #6a737d;
      }
    </style>
  </defs>

  <!-- Title -->
  <text x="20" y="28" class="title">Contribution History</text>
  <text x="20" y="48" class="subtitle">📈 Active contributions over the last year</text>

  <!-- Legend -->
  <g>
    <text x="20" y="70" class="subtitle">Less</text>
    <rect x="65" y="60" width="14" height="14" rx="2" fill="#ebedf0"/>
    <rect x="83" y="60" width="14" height="14" rx="2" fill="#c6e48b"/>
    <rect x="101" y="60" width="14" height="14" rx="2" fill="#7bc96f"/>
    <rect x="119" y="60" width="14" height="14" rx="2" fill="#239a3b"/>
    <rect x="137" y="60" width="14" height="14" rx="2" fill="#196127"/>
    <text x="160" y="70" class="subtitle">More</text>
  </g>

  <!-- Day labels -->
  <text x="5" y="115" class="day-label">Mon</text>
  <text x="5" y="175" class="day-label">Wed</text>
